    <style>
        body {
            background: url('images/main/lk-bg-main.gif') center/cover no-repeat;
        }

        .title {
            position: relative;
            bottom: 9rem;
            /* bottom-36 */
            text-align: center;
            color: #d97706;
            /* text-amber-600 */
            font-weight: 800;
            /* font-extrabold */
            font-size: 5rem;
            /* text-4xl */
            line-height: 1.1;
            /* leading-tight */

            font-family: 'WakNan', sans-serif;
        }

        .card-rectangle {
            position: relative;
            /* relative */
            bottom: 3rem;
            /* bottom-12 */
            width: 90%;
            /* w-[95%] */
            max-width: 100%;
            /* max-w-full */
            height: 70%;
            /* h-[70%] */
            max-height: 500px;
            /* max-h-[500px] */

            border-radius: 0.5rem;
            /* rounded-lg */
        }

        .card-gap {
            display: flex;
            /* flex */
            flex-wrap: wrap;
            /* flex-wrap */
            justify-content: center;
            /* justify-center */
            gap: 2rem;
            /* gap-8 */
            animation: fade-up 1s ease;
            /* animate-fade-up (assumes fade-up is defined elsewhere) */
        }

        .card-border {
            margin-top: 1.25rem;
            /* my-5 */
            margin-bottom: 1.25rem;
            border: 2px solid white;
            padding: 1rem;
            /* p-4 */
            border-radius: 0.5rem;
            /* rounded-lg */
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            /* shadow-lg */
            transition: all 0.2s;
            width: 14rem;
            /* w-56 */
            height: 20rem;
            /* h-80 */
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateX(2.5rem);
            /* translate-x-10 */
        }

        .card-border:hover {
            transform: scale(1.05) translateY(-0.5rem);
            /* hover:scale-105 & hover:-translate-y-2 */
            border-color: white;
            /*background-color: rgba(255, 255, 255, 0.9);
            /* hover:bg-opacity-90 approximation */
        }

        .card-white {
            background-color: white;
            width: 100%;
            height: 70%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            /* rounded-lg */
            padding: 0.5rem;
            /* p-2 */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            /* shadow-md */
            transition: all 0.2s;
        }

        .card-white:hover {
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
            /* hover:shadow-lg */
            background-color: #f3f4f6;
            /* hover:bg-gray-100 */
        }

        .card-image {
            width: 9rem;
            /* w-36 */
            height: 9rem;
            /* h-36 */
            transition: transform 0.3s ease-in-out;
            /* transition-transform duration-300 ease-in-out */
        }

        .card-image:hover {
            transform: scale(1.1);
            /* hover:scale-110 */
        }

        .card-text {
            font-size: 110%;
            /* text-[110%] */
            margin-top: 2rem;
            /* mt-8 */
            font-weight: 800;
            /* font-extrabold */
            font-family: 'WakNan', sans-serif;
            /* font-[WakNan] */
            text-align: center;
            /* text-center */
        }

        .prev-button {
            position: absolute;
            /* absolute */
            left: 0;
            /* left-0 */
            top: 50%;
            /* top-1/2 */
            transform: translateY(-50%);
            /* -translate-y-1/2 */
            padding: 0.5rem;
            /* p-2 = 0.5rem */
        }

        .next-button {
            position: absolute;
            /* absolute */
            right: 0;
            /* right-0 */
            top: 50%;
            /* top-1/2 */
            transform: translateY(-50%);
            /* -translate-y-1/2 */
            padding: 0.5rem;
            /* p-2 = 0.5rem */
        }


        .page-dots {
            display: flex;
            /* flex */
            justify-content: center;
            /* justify-center */
            gap: 0.75rem;
            /* gap-3 = 0.75rem */
            margin-top: 2.5rem;
            /* mt-10 = 2.5rem */
        }

        .scroll-container {
            scrollbar-color: #ffc107 #f4f4f4;
            scrollbar-width: thin;
        }

        @keyframes rotate-card {
            from {
                transform: rotateY(0deg);
            }

            to {
                transform: rotateY(360deg);
            }
        }

        .rotate {
            animation: rotate-card 0.78s ease-in-out forwards;

                border-radius: 0.5rem;
                /* rounded-lg */
                box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
                /* shadow-lg */
                transition: all 0.2s;
                width: 13.2rem;
                /* w-56 */
                height: 20rem;
                /* h-80 */
                display: flex;
                flex-direction: column;
                align-items: center;
                opacity: 0;
                transform: translateX(2.5rem);
                /* translate-x-10 */
            }

            .card-border:hover {
                transform: scale(1.05) translateY(-0.5rem);
                /* hover:scale-105 & hover:-translate-y-2 */
                border-color: white;
                /*background-color: rgba(255, 255, 255, 0.9);
            /* hover:bg-opacity-90 approximation */
            }

            .card-white {
                background-color: white;
                width: 100%;
                height: 70%;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 0.5rem;
                /* rounded-lg */
                padding: 0.5rem;
                /* p-2 */
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                /* shadow-md */
                transition: all 0.2s;
            }

            .card-white:hover {
                box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
                /* hover:shadow-lg */
                background-color: #f3f4f6;
                /* hover:bg-gray-100 */
            }

            .card-image {
                width: 9rem;
                /* w-36 */
                height: 9rem;
                /* h-36 */
                transition: transform 0.3s ease-in-out;
                /* transition-transform duration-300 ease-in-out */
            }

            .card-image:hover {
                transform: scale(1.1);
                /* hover:scale-110 */
            }

            .card-text {
                font-size: 110%;
                /* text-[110%] */
                margin-top: 2rem;
                /* mt-8 */
                font-weight: 800;
                /* font-extrabold */
                font-family: 'WakNan', sans-serif;
                /* font-[WakNan] */
                text-align: center;
                /* text-center */
            }

            .prev-button {
                position: absolute;
                /* absolute */
                left: 0;
                /* left-0 */
                top: 50%;
                /* top-1/2 */
                transform: translateY(-50%);
                /* -translate-y-1/2 */
                padding: 0.5rem;
                /* p-2 = 0.5rem */
            }

            .next-button {
                position: absolute;
                /* absolute */
                right: 0;
                /* right-0 */
                top: 50%;
                /* top-1/2 */
                transform: translateY(-50%);
                /* -translate-y-1/2 */
                padding: 0.5rem;
                /* p-2 = 0.5rem */
            }


            .page-dots {
                display: flex;
                /* flex */
                justify-content: center;
                /* justify-center */
                gap: 0.75rem;
                /* gap-3 = 0.75rem */
                margin-top: 2.5rem;
                /* mt-10 = 2.5rem */
            }

            .scroll-container {
                scrollbar-color: #ffc107 #f4f4f4;
                scrollbar-width: thin;
            }

            @keyframes rotate-card {
                from {
                    transform: rotateY(0deg);
                }

                to {
                    transform: rotateY(360deg);
                }
            }

            .rotate {
                animation: rotate-card 0.78s ease-in-out forwards;
            }
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen bg-white p-4">
    <h1 class="title">
        Lukisan
        <div class="text-amber-100">Kejuruteraan</div>
    </h1>

    <div class=" card-rectangle">
        <div class="h-[70%] bg-transparent ">
            <div id="cardContainer" class="card-gap"></div>
        </div>

        <!-- Navigation Buttons -->
        <button id="prevBtn" class="prev-button">
            <svg class="w-10 h-10 text-amber-300 hover:text-amber-600" xmlns="http://www.w3.org/2000/svg" fill="none"
                stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
                viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
        </button>
        <button id="nextBtn" class="next-button">
            <svg class="w-10 h-10 text-amber-300 hover:text-amber-600" xmlns="http://www.w3.org/2000/svg" fill="none"
                stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
                viewBox="0 0 24 24">
                <path d="M9 18l6-6-6-6"></path>
            </svg>
        </button>

        <!-- Pagination Dots -->
        <div class="page-dots">
            <div id="paginationDots" class="flex gap-x-3"></div>
        </div>
    </div>

    <script>
        const cards = [
            { title: 'Segi Tiga & Poligon', link: 'chapter1.html', image: 'images/main/icon-c1.png' },
            { title: 'Lukis Semula & Pembesaran', link: 'chapter2.html', image: 'images/main/icon-c2.png' },
            { title: 'Rajah Sama Luas', link: 'chapter3.html', image: 'images/main/icon-c3.png' },
            { title: 'Tangen', link: 'chapter4.html', image: 'images/main/icon-c4.png' },
            { title: 'Unjuran Ortografik', link: 'chapter5.html', image: 'images/main/icon-c5.png' },
            { title: 'Pandangan Bantuan', link: 'chapter6.html', image: 'images/main/icon-pandanganbantuan.png' },
            { title: 'Isometri', link: 'chapter7.html', image: 'images/main/icon-c9.png' },
            { title: 'Oblik', link: 'chapter8.html', image: 'images/main/icon-c10.png' },
            { title: 'Perspektif', link: 'chapter9.html', image: 'images/main/icon-perspektif.png' },
            { title: 'Pengorakan', link: 'chapter10.html', image: 'images/main/icon-c6.png' },
            { title: 'Lukisan Bangunan', link: 'chapter11.html', image: 'images/main/icon-c7.png' },
            { title: 'Lukisan Mekanikal', link: 'chapter12.html', image: 'images/main/icon-c8.png' },
            { title: 'Persilangan', link: 'chapter13.html', image: 'images/main/icon-c11.png' }
        ];

        const cardsPerPage = 5;
        let currentPage = 0;

        const colors = [
            'bg-red-300', 'bg-indigo-300', 'bg-orange-300', 'bg-lime-300',
            'bg-purple-300', 'bg-indigo-300', 'bg-lime-300', 'bg-amber-300',
            'bg-purple-300', 'bg-sky-300', 'bg-red-300', 'bg-indigo-300', 'bg-amber-300'
        ];

        function renderCards(direction = 'next') {
            const cardContainer = document.getElementById('cardContainer');

            // Step 1: Add exit animation
            cardContainer.classList.add(direction === 'next' ? 'animate-slide-left' : 'animate-slide-right');
            cardContainer.style.opacity = '100';

            setTimeout(() => {
                cardContainer.innerHTML = ''; // Clear previous cards

                const start = currentPage * cardsPerPage;
                const end = start + cardsPerPage;

                cards.slice(start, end).forEach((card, index) => {
                    const colorClass = colors[index % colors.length]; // Cycle through colors

                    const cardElement = document.createElement('a');
                    cardElement.href = card.link;
                    cardElement.className = `${colorClass} card-border`;

                    cardElement.innerHTML = `
                <div class="card-white">
                    <img src="${card.image}" alt="${card.title}" class="card-image">
                </div>
                <p class="card-text">${card.title}</p>
            `;

                    cardElement.addEventListener('click', (event) => {
                        event.preventDefault();
                        cardElement.classList.add('rotate');

                        setTimeout(() => {
                            window.location.href = card.link;
                        }, 800); // Delay 8 seconds
                    });

                    cardContainer.appendChild(cardElement);

                    // Add animation after slight delay for each card
                    setTimeout(() => {
                        cardElement.classList.remove('opacity-0', 'translate-x-10');
                        cardElement.classList.add('opacity-100', 'translate-x-0', 'transition-all', 'duration-500');
                    }, index * 100);
                });

                updatePagination();

                // Step 2: Remove exit animation and add fade-in effect
                setTimeout(() => {
                    cardContainer.classList.remove('animate-slide-left', 'animate-slide-right');
                    cardContainer.style.opacity = '1';
                }, 500);
            }, 300);
        }

        // Handle Next/Previous buttons
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                renderCards('prev');
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentPage < Math.ceil(cards.length / cardsPerPage) - 1) {
                currentPage++;
                renderCards('next');
            }
        });

        function updatePagination() {
            const paginationDots = document.getElementById('paginationDots');
            paginationDots.innerHTML = '';

            for (let i = 0; i < Math.ceil(cards.length / cardsPerPage); i++) {
                const dot = document.createElement('button');

                dot.className = `w-3 h-3 rounded-full transition-all duration-300 ease-in-out ${i === currentPage ? 'bg-amber-500 w-6 scale-110' : 'bg-gray-500 hover:bg-amber-300'
                    }`;

                dot.style.opacity = '0';
                paginationDots.appendChild(dot);

                setTimeout(() => {
                    dot.style.opacity = '1';
                }, i * 80); // Staggered fade-in effect

                dot.addEventListener('click', () => {
                    currentPage = i;
                    renderCards();
                });
            }
        }
        renderCards();

    </script>
</body>

</html>
